name: Deploy to AUR

on:
  push:
    paths:
      - 'PKGBUILD'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aur
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      # default 64MB /dev/shm starves turbopack/swc worker IPC; the
      # soft nofile limit (1024) starves tailwind/postcss file scanning;
      # --init gives the container a proper PID1 to reap workers
      options: --shm-size=2g --init --ulimit nofile=65536:65536
    timeout-minutes: 90
    if: startsWith(github.ref, 'refs/heads/main')

    steps:
    - name: Install git and openssh (needed before checkout)
      run: pacman -Syu --noconfirm git openssh

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}
        fetch-depth: 0

    - name: Setup SSH for AUR
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        # -i with an absolute path: in job containers $HOME (/github/home)
        # differs from the passwd home (/root) that ssh expands "~" to,
        # so ssh would not find the default identity on its own.
        # accept-new instead of ssh-keyscan: port-22 scanning from the
        # job container can silently return no keys.
        git config --global core.sshCommand "ssh -i $HOME/.ssh/id_rsa -o StrictHostKeyChecking=accept-new"

    - name: Compare with AUR and compute pkgrel
      run: |
        git clone ssh://aur@aur.archlinux.org/note-gen.git aur-repo

        if diff PKGBUILD aur-repo/PKGBUILD > /dev/null 2>&1; then
          echo "ℹ️ PKGBUILD content is identical to AUR, no changes needed"
          echo "NO_CHANGES=true" >> $GITHUB_ENV
        else
          LOCAL_VERSION=$(grep "^pkgver=" PKGBUILD | cut -d'=' -f2)
          AUR_VERSION=$(grep "^pkgver=" aur-repo/PKGBUILD | cut -d'=' -f2)
          AUR_PKGREL=$(grep "^pkgrel=" aur-repo/PKGBUILD | cut -d'=' -f2)

          if [ "$LOCAL_VERSION" = "$AUR_VERSION" ]; then
            NEW_PKGREL=$((AUR_PKGREL + 1))
            echo "Same version, incrementing pkgrel from $AUR_PKGREL to $NEW_PKGREL"
          else
            NEW_PKGREL=1
            echo "Different version ($LOCAL_VERSION vs $AUR_VERSION), resetting pkgrel to 1"
          fi

          sed -i "s/^pkgrel=.*/pkgrel=$NEW_PKGREL/" PKGBUILD
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> $GITHUB_ENV
          echo "NEW_PKGREL=$NEW_PKGREL" >> $GITHUB_ENV
        fi

    - name: Install build dependencies (official repos only)
      if: env.NO_CHANGES != 'true'
      run: |
        pacman -S --needed --noconfirm \
          rust nodejs npm pnpm pkgconf clang \
          gtk3 webkit2gtk-4.1 libappindicator-gtk3 librsvg libvips libxcb libxrandr \
          dbus pipewire wayland libglvnd glib2 mesa sqlite patchelf

    - name: Build gate — real makepkg build, then regenerate .SRCINFO
      if: env.NO_CHANGES != 'true'
      run: |
        # makepkg refuses to run as root; build as an unprivileged user
        useradd -m builder 2>/dev/null || true
        chown -R builder:builder .

        # The gate: if the package cannot be built on current Arch from
        # official-repo dependencies, this fails and nothing is pushed
        # to the AUR.
        #
        # Two phases with a CI-only detour in between: Turbopack's
        # PostCSS worker deadlocks on 4-core runners (vercel/next.js
        # discussions/84495), so CI builds the frontend with webpack,
        # with type checking disabled (upstream's turbopack builds do
        # not run that validation either). The PKGBUILD is untouched —
        # users keep building the upstream way. Revisit when the
        # upstream bug is fixed.
        runuser -u builder -- makepkg --nobuild --noconfirm
        runuser -u builder -- bash -c 'cd src/note-gen-note-gen-v*/ && sed -i "s/next build --turbopack/next build/" package.json && sed -i "s|^export default configuredNext;|configuredNext.typescript = { ignoreBuildErrors: true };\nexport default configuredNext;|" next.config.ts'
        runuser -u builder -- makepkg -sf --noextract --noconfirm

        # .SRCINFO is always regenerated from the final PKGBUILD —
        # no template editing, no stale filenames, no null garbage.
        runuser -u builder -- makepkg --printsrcinfo > .SRCINFO

        chown -R root:root .
        ls -la .SRCINFO *.pkg.tar.zst
        grep -E "pkgver|pkgrel|source" .SRCINFO

    - name: Commit pkgrel and regenerated .SRCINFO to GitHub
      if: env.NO_CHANGES != 'true'
      run: |
        git config user.name "ChHsich"
        git config user.email "hsichingchang@gmail.com"

        git add PKGBUILD .SRCINFO
        if git diff --cached --quiet; then
          echo "ℹ️ Nothing to commit back"
        else
          git commit -m "🔖 chore(aur): update pkgrel to ${{ env.NEW_PKGREL }} based on AUR state"
          git pull --rebase origin main
          git push origin main
        fi

    - name: Deploy to AUR
      if: env.NO_CHANGES != 'true'
      run: |
        cd aur-repo
        cp ../PKGBUILD ../.SRCINFO ./
        if [ -f ../note-gen.install ]; then cp ../note-gen.install ./; fi

        if git diff --quiet && git diff --cached --quiet; then
          echo "ℹ️ No changes to deploy"
        else
          git config user.name "ChHsich"
          git config user.email "hsichingchang@gmail.com"
          git add PKGBUILD .SRCINFO
          [ -f note-gen.install ] && git add note-gen.install || true
          git commit -m "🔖 chore(aur): update to version ${{ env.LOCAL_VERSION }}-${{ env.NEW_PKGREL }}"
          git push origin master
        fi

    - name: Clean up SSH keys
      if: always()
      run: rm -rf ~/.ssh
