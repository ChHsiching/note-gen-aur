name: Check Upstream Updates

on:
  schedule:
    # 每小时检查一次更新
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}

    - name: Get current version
      run: |
        CURRENT_VERSION=$(grep '^pkgver=' PKGBUILD | cut -d'=' -f2)
        echo "Current version: $CURRENT_VERSION"
        echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

    - name: Check upstream release
      run: |
        # Get latest release from GitHub API
        LATEST_RELEASE=$(curl -fSL "https://api.github.com/repos/codexu/note-gen/releases/latest" |
                         jq -r '.tag_name' | sed 's/note-gen-v//') || {
          echo "⚠️ Failed to fetch upstream release from GitHub API"
          exit 1
        }

        echo "Latest release: $LATEST_RELEASE"
        echo "Current version: $CURRENT_VERSION"

        # Block literal null / empty response and treat as no update.
        if [ "$LATEST_RELEASE" = "null" ] || [ -z "$LATEST_RELEASE" ]; then
          echo "⚠️ Upstream API returned invalid release, skipping"
          exit 0
        fi

        if ! echo "$LATEST_RELEASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "⚠️ Unexpected version format: '$LATEST_RELEASE', aborting"
          exit 1
        fi

        if [ "$LATEST_RELEASE" != "$CURRENT_VERSION" ]; then
          echo "NEW_VERSION=$LATEST_RELEASE" >> $GITHUB_ENV
          echo "✅ New version available: $LATEST_RELEASE"
        else
          echo "ℹ️ No updates available"
          exit 0
        fi

    - name: Update PKGBUILD for new version
      if: env.NEW_VERSION
      run: |
        NEW_VERSION="${{ env.NEW_VERSION }}"

        # Update PKGBUILD only — .SRCINFO is regenerated from PKGBUILD by
        # the deploy pipeline (makepkg --printsrcinfo). Never sed-edit
        # .SRCINFO here: template edits are how the nullnull/eaten-dot
        # URL corruption happened twice.
        sed -i "s/^pkgver=.*/pkgver=$NEW_VERSION/" PKGBUILD
        sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
        sed -i "s/archive\/note-gen-v[0-9\.]*\.tar\.gz/archive\/note-gen-v$NEW_VERSION.tar.gz/" PKGBUILD

        FILENAME="note-gen-$NEW_VERSION.tar.gz"
        curl -fSL -o "$FILENAME" "https://github.com/codexu/note-gen/archive/note-gen-v$NEW_VERSION.tar.gz"

        CHECKSUM=$(sha256sum "$FILENAME" | cut -d' ' -f1)
        echo "Generated checksum: $CHECKSUM"
        sed -i "s/sha256sums=.*/sha256sums=('$CHECKSUM')/" PKGBUILD

        echo "Updated PKGBUILD for version $NEW_VERSION"

    - name: Commit version update
      if: env.NEW_VERSION
      run: |
        git config user.name "ChHsich"
        git config user.email "hsichingchang@gmail.com"

        NEW_VERSION="${{ env.NEW_VERSION }}"
        git add PKGBUILD
        git commit -m "🚀 chore(upstream): update to version $NEW_VERSION"
        git push origin main

        echo "Version $NEW_VERSION committed and pushed (deploy workflow will build and publish)"
